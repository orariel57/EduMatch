<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>EduMatch | הרשמה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./image/favicon.png">
</head>

<body>
  <header>
    <div class="top-bar">
      <div class="logo-row">
        <button class="nav-toggle" aria-label="פתח תפריט" aria-expanded="false">☰</button>

        <a href="index.html" class="logo-link">
          <img src="./image/logoEduMatch.png" alt="EduMatch" class="logo-img">
        </a>

        <span class="logo-spacer" aria-hidden="true"></span>
      </div>

      <nav>
        <ul class="main-nav">
          <li><a href="index.html">דף הבית</a></li>
          <li><a href="teachers.html">חיפוש מורים</a></li>
          <li><a href="profile.html">הפרופיל שלי</a></li>
        </ul>

        <ul class="auth-nav" id="auth-nav">
          <li><a href="login.html">התחברות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-page" aria-labelledby="register-page-title">
      <h1 id="register-page-title">הרשמה</h1>

      <p class="auth-intro">
        משתמשים חדשים יכולים ליצור חשבון חדש כמורה או כתלמיד.
      </p>

      <div class="auth-layout auth-layout--single">

        <!-- 🔧 חיבור לשרת בלבד -->
        <form class="auth-card register-card" id="register-form" action="/api/register" method="POST"
          autocomplete="off">

          <h2>יצירת חשבון</h2>
          <p class="auth-card-desc">
            מלאו את הפרטים ובחרו תפקיד במערכת.
          </p>

          <div class="form-alert" id="register-alert" role="alert" aria-live="polite" hidden></div>

          <!-- 🔧 name שונה – התוכן נשאר -->
          <div class="form-row">
            <label for="first-name">שם פרטי <span>*</span></label>
            <input type="text" id="first-name" name="first_name" required>
            <p class="error-message"></p>
          </div>

          <div class="form-row">
            <label for="last-name">שם משפחה <span>*</span></label>
            <input type="text" id="last-name" name="last_name" required>
            <p class="error-message"></p>
          </div>


          <div class="form-row">
            <label for="register-email">אימייל <span>*</span></label>
            <input type="email" id="register-email" name="email" required>
            <p class="error-message"></p>
          </div>

          <div class="form-row">
            <label for="register-phone">טלפון נייד <span></span></label>
            <input type="tel" id="register-phone" name="phone" pattern="^05[0-9]{8}$" maxlength="10" inputmode="tel"
              placeholder="לדוגמה: 0521234567">
            <p class="error-message"></p>
          </div>

          <div class="form-row">
            <label for="register-password">סיסמה (מינימום 6 תווים) <span>*</span></label>
            <input type="password" id="register-password" name="password" minlength="6" required>
            <p class="error-message"></p>
          </div>

          <!-- ⚠️ לא נוגעים – זה מה שה־JS שלך משתמש בו -->
          <div class="form-row">
            <span class="field-label">תפקיד במערכת:</span>
            <div class="options-row">
              <label>
                <input type="radio" name="role" value="student" checked>
                תלמיד/ה
              </label>
              <label>
                <input type="radio" name="role" value="teacher">
                מורה
              </label>
            </div>
          </div>

          <!-- ⚠️ לא נוגעים -->
          <div class="form-row">
            <span class="field-label">מצב מועדף לשיעור:</span>
            <div class="options-row">
              <label>
                <input type="radio" name="lesson-mode" value="online" checked>
                מקוון
              </label>
              <label>
                <input type="radio" name="lesson-mode" value="frontal">
                פרונטלי
              </label>
              <label>
                <input type="radio" name="lesson-mode" value="both">
                שניהם
              </label>
            </div>
          </div>

          <div class="role-fields role-teacher">
            <h3>פרטים למורה</h3>

            <div class="form-row">
              <label for="teacher-city">עיר</label>
              <input list="cities-list" id="teacher-city" name="teacher-city">
            </div>

            <div class="form-row">
              <label>תחומי הוראה ומחיר לשעה</label>
              <div id="subjects-container" class="subjects-list">
                <div class="subject-row">
                  <input type="text" name="teacher-subject[]" placeholder="מקצוע">
                  <input type="number" name="teacher-price[]" placeholder="מחיר לשעה">
                </div>
              </div>
              <button type="button" id="add-subject-btn" class="add-subject-btn">הוסף מקצוע</button>
            </div>

            <div class="form-row">
              <label for="teacher-experience">שנות ניסיון</label>
              <input type="number" id="teacher-experience" name="teacher-experience">
            </div>

            <div class="form-row">
              <label for="lesson-duration">משך שיעור (בדקות)</label>
              <input type="number" id="lesson-duration" name="lesson-duration">
            </div>
          </div>

          <!-- ⚠️ תנאים – לא הוסר -->
          <div class="form-row checkbox-row">
            <label>
              <input type="checkbox" name="terms" required>
              אני מאשר/ת את
              <a href="terms.html" target="_blank">תנאי השימוש</a>
              ו
              <a href="privacy.html" target="_blank">מדיניות הפרטיות</a>
            </label>
          </div>

          <div class="form-row form-actions">
            <button type="submit" class="btn-primary">צור חשבון</button>
          </div>

          <p class="auth-switch">
            כבר יש לך חשבון?
            <a href="login.html">התחבר/י</a>
          </p>

        </form>
      </div>
    </section>

    <!-- datalist נשאר -->
    <datalist id="cities-list">
      <option value="תל אביב-יפו">
      <option value="באר שבע">
      <option value="ירושלים">
    </datalist>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-links">
        <a href="privacy.html">מדיניות פרטיות</a>
        <a href="terms.html">תנאי שימוש</a>
        <p>© 2025 EduMatch כל הזכויות שמורות.</p>
      </div>
    </div>
  </footer>

  <!-- ⚠️ ה־JS שלך נשאר -->
  <script src="./js/login.js"></script>
  <script src="./js/nav.js"></script>
</body>

</html>
